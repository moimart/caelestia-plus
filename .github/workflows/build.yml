name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/shell-arch-env:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: CMake build
        run: |
          # Set version and git rev for CI build so we don't call git
          cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS=-Werror \
            -DVERSION= -DGIT_REVISION=
          cmake --build build
