# Font (matches foot.ini)
font_family      Hack Nerd Font Mono
bold_font        Hack Nerd Font Mono Bold
italic_font      Hack Nerd Font Mono Italic
bold_italic_font Hack Nerd Font Mono Bold Italic
disable_ligatures never
# Icons drawn fuller-to-cell via Symbols Nerd Font
symbol_map U+E000-U+E09F,U+E0D5-U+F8FF Symbols Nerd Font
symbol_map U+F0000-U+FFFFD Symbols Nerd Font
# Round powerline caps from Meslo (the p10k-recommended font)
symbol_map U+E0A0-U+E0C8,U+E0CC-U+E0D4 MesloLGS Nerd Font Mono
font_size        12
adjust_line_height  0
adjust_column_width 0

# Window
window_padding_width 25
hide_window_decorations yes
confirm_os_window_close 0

# Cursor
cursor_shape block
cursor_beam_thickness 1.5

# Scrollback
scrollback_lines 10000

# Background opacity (matches foot's [colors-dark] alpha=0.85)
background_opacity 0.85
dynamic_background_opacity yes

# Bell
enable_audio_bell no

# Behaviour
shell bash
term xterm-kitty

# Allow dynamic OSC color updates from caelestia
allow_remote_control no
